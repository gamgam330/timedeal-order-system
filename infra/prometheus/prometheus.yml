global:
  # 부하 테스트는 몇 분 단위로 짧게 돌아가므로 수집 간격을 기본(1m)보다 촘촘하게 잡는다
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: timedeal-app
    metrics_path: /actuator/prometheus
    static_configs:
      # 관리 포트. 8083은 서버 2대로 측정할 때 두 번째 앱 (03단계). 앱이 1대면 8083은 down으로 보일 뿐 영향 없다
      - targets: ["host.docker.internal:8081", "host.docker.internal:8083"]
