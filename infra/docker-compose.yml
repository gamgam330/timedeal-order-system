services:
  mysql:
    image: mysql:8.4.11
    container_name: timedeal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: timedeal
      MYSQL_USER: ${MYSQL_USER:-timedeal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-timedeal}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    # 측정 환경 고정: 실행할 때마다 DB가 쓸 수 있는 자원이 같아야 수치를 비교할 수 있다
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11
    container_name: timedeal-redis
    # 03단계부터: 분산 락. 락은 잠깐 쓰고 버리는 값이라 디스크 저장(RDB, AOF)을 끈다. 저장 작업이 측정에 섞이지 않게 하려는 목적도 있다
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379" # 비밀번호 없는 로컬 전용이라 외부에서 접속하지 못하게 한다
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: timedeal-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # K6가 측정 결과를 Prometheus로 밀어 넣을 수 있게 한다 (01단계에서 사용)
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # 애플리케이션은 컨테이너가 아니라 호스트에서 실행된다
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.4
    container_name: timedeal-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # 패널을 PNG로 렌더링한다 (블로그용 그래프 캡처: make capture)
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${RENDERER_TOKEN:-local-renderer-token}
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - renderer

  renderer:
    image: grafana/grafana-image-renderer:v5.12.7
    container_name: timedeal-renderer
    environment:
      AUTH_TOKEN: ${RENDERER_TOKEN:-local-renderer-token}

volumes:
  prometheus-data:
