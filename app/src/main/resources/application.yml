spring:
  application:
    name: timedeal
  datasource:
    url: jdbc:mysql://localhost:3306/timedeal
    # 로컬 개발용 기본값. 실제 비밀값은 환경 변수로만 주입한다 (CLAUDE.md 12장)
    username: ${DB_USERNAME:timedeal}
    password: ${DB_PASSWORD:timedeal}
    # HikariCP 기본 풀 크기(10)를 일부러 그대로 둔다. 01단계 부하 테스트에서 다시 본다.
  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway가 관리하고, JPA는 엔티티와 맞는지 검증만 한다
    open-in-view: false # 요청이 끝날 때까지 DB 커넥션을 붙잡지 않게 한다
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  tomcat:
    mbeanregistry:
      enabled: true # 꺼져 있으면 tomcat_threads_* 지표가 수집되지 않는다

management:
  server:
    # 관리 엔드포인트를 별도 포트(별도 Tomcat 커넥터와 스레드 풀)로 분리한다.
    # 같은 포트를 쓰면 과부하 때 지표 수집 요청도 주문 요청과 같은 대기열에 줄을 서서 모니터링이 끊긴다. (troubleshooting 001)
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 히스토그램 버킷을 내보내야 Prometheus에서 p95/p99를 계산할 수 있다
      percentiles-histogram:
        http.server.requests: true

# 가짜 PG: 지연 시간과 실패율을 조절해서 장애 상황을 재현한다
pg:
  latency-ms: 300
  failure-rate: 0.0
